name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (pinned versions, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            numpy==1.26.3 scipy==1.12.0 matplotlib==3.8.2 h5py==3.12.1 tqdm==4.66.2 \
            torch==2.5.1 sbi==0.22.0 nflows==0.14 pyknos==0.16.0 arviz==0.23.1 pytest==8.3.3
          pip install -e . --no-deps
      - name: Tests
        run: pytest -q
      - name: Shipped networks load and sample
        run: |
          python - <<'PY'
          from GWBackFinder import Simulator
          from GWBackFinder.posterior import load_posterior, sample_two_step
          sim = Simulator()
          AA, TT, _, _ = sim.different_signals("powerlaw", [-10.0, 0.6], (15.0, 3.0), rng=0)
          s, p = sample_two_step(load_posterior("examples/AA_channel/posterior_AA.pkl"),
                                 load_posterior("examples/TT_channel/posterior_TT.pkl"), AA, TT, n_samples=100)
          print("samples", s.shape, "P median", float(p.mean()))
          PY
